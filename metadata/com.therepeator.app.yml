Summary: Mobile HTTP request testing tool and request repeater for Android
Description: |-
  TheRepeator is a Privacy-focused, Free and Open Source (FOSS) mobile HTTP request testing tool.

  Features:
  * Send custom HTTP/HTTPS requests
  * Edit headers, query params, and request body
  * Inspect status codes, headers, and formatted body responses
  * Replay requests and view history
  * Utility tools: Base64, URL, Hex, and JWT encoders/decoders

